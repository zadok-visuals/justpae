# Supabase CLI project config.
#
# `project_id` is only a local label for the CLI's own state directory — it is
# NOT the remote project ref. The remote project is chosen by
# `supabase link --project-ref <ref>`, which writes the ref into
# supabase/.temp/ (gitignored).
#
# Everything below is the local-development stack only. Running
# `supabase db push` against a linked remote project does not read the [db],
# [auth] or [api] blocks — the remote project's own dashboard settings govern
# there. They are kept so `supabase start` produces a local stack that behaves
# like production.
project_id = "justpae"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
# Keep every migration under version control and applied in filename order.
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# KYC documents are images and PDFs; nothing legitimate here is large.
file_size_limit = "10MiB"

[auth]
enabled = true
# Overridden per environment. Locally this is the dev server; in production the
# remote project's Site URL must be set to the deployed app URL, because every
# confirmation and recovery link is built from it.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# Email confirmation is required: a wallet must not exist for an unverified
# address. The confirmation link goes through /auth/confirm with a token hash,
# not a PKCE code — see supabase/email-templates/README.md for why.
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.external.google]
# Google sign-in is offered on the login screen. The client id/secret are set
# in the remote project's dashboard (or via these env vars locally); they are
# never committed.
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
