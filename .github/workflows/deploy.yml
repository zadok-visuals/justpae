name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  # 1. SHARED WEB BUILD + VERCEL DEPLOY
  build-and-deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # FIXED: Force a clean installation architecture mapping in the cloud container
      - run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      # Inject Supabase env vars so the build uses real values (not hardcoded fallback)
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Deploy the built dist/ folder to Vercel
      - name: Deploy to Vercel
        run: npx vercel --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # 2. ANDROID BUILD
  build-android:
    name: Build Android
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # FIXED: Force a clean installation architecture mapping in the cloud container
      - run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # 3. iOS APP STORE DEPLOY
  deploy-ios:
    name: Deploy to App Store
    needs: build-and-deploy
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # FIXED: Force a clean installation architecture mapping in the cloud container
      - run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - run: npx cap sync ios
      
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Fastlane
        working-directory: ios/App
        run: |
          gem install bundler
          bundle install

      - name: Deploy to TestFlight/App Store
        run: |
          cd ios/App
          bundle exec fastlane deploy
        env:
            APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
            APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
            APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}

