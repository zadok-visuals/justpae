name: Build and Deploy

on:
  workflow_dispatch:

jobs:
  # 1. SHARED WEB BUILD
  build:
    name: Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci # Safer, deterministic installs for CI/CD environments
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist # Removed trailing slash to prevent nested asset directories

  # 2. ANDROID BUILD
  build-android:
    name: Build Android
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist # Downloads directly into the project root dist folder
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # 3. iOS APP STORE DEPLOY
  deploy-ios:
    name: Deploy to App Store
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci # Ensures Capacitor and your project dependencies are correctly mirrored

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist # Places assets exactly where capacitor.config.ts looks for them

      - run: npx cap sync ios # Copies the freshly verified dist directory directly to Xcode
      
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Fastlane
        working-directory: ios/App
        run: |
          gem install bundler
          bundle install

      - name: Deploy to TestFlight/App Store
        run: |
          cd ios/App
          bundle exec fastlane deploy
        env:
            APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
            APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
            APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
